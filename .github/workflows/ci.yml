# CI: build the flake package (compiles all four binaries and runs the test
# suite via the derivation's check phase), then the repo lints. Everything
# runs through Nix so CI uses byte-identical toolchains and dependencies to
# the local dev shell.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    name: Build + tests (nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build package (includes ctest suite)
        run: nix build --print-build-logs

  lint:
    name: Lints (clang-format, REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: clang-format (dry run)
        run: |
          nix develop --command bash -c \
            'git ls-files "*.cpp" "*.h" | xargs clang-format --dry-run --Werror'
      - name: REUSE compliance
        run: nix develop --command reuse lint
